<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dr. Fahmida Bristy — Registered Veterinary Doctor, Bangladesh</title>
    <meta
      name="description"
      content="Portfolio of Dr. Fahmida Bristy, a registered Veterinary Doctor in Bangladesh (BVC Registration No. 10592), with international internship experience at Prince of Songkla University, Thailand."
    />
    <meta name="author" content="Dr. Fahmida Bristy" />

    <!-- Open Graph. og:url and og:image are added at runtime only once a real
         siteUrl / photo is set in src/data/profile.js, so no fake links ship. -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Dr. Fahmida Bristy — Registered Veterinary Doctor" />
    <meta
      property="og:description"
      content="Registered Veterinary Doctor in Bangladesh (BVC Registration No. 10592). Graduate of Sher-e-Bangla Agricultural University; international internship at Prince of Songkla University, Thailand."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#F6F3EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1C16" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved (or system) theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
